name: Telemetry report

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Archive old telemetry rows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Pipefail so a failing archive step is not masked by tee (the step
        # must fail even though tee exits 0).
        run: |
          set -o pipefail
          npm run telemetry:archive -- --apply 2>&1 | tee telemetry-archive.txt

      - name: Run telemetry report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # --strict exits non-zero when a quality gate fails; without pipefail
        # the pipeline would report tee's exit code and the workflow would stay
        # green while the gates fail. Do not remove.
        run: |
          set -o pipefail
          npm run telemetry:report -- --days=7 --strict 2>&1 | tee telemetry-report.txt

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-report
          path: |
            telemetry-report.txt
            telemetry-archive.txt
