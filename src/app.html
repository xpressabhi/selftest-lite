<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=5, user-scalable=yes"
		/>
		<meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f0f1a" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="selftest.in" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="google-adsense-account" content="ca-pub-7214001284506571" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" href="/icons/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
		<script>
			// Pre-paint preferences: apply saved theme/language/data-saver from
			// localStorage before first paint to avoid theme/language flashes.
			(function () {
				try {
					var stored = window.localStorage;
					var theme = stored.getItem('selftest_theme') || 'system';
					var dark =
						theme === 'dark' ||
						(theme === 'system' &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) {
						document.documentElement.classList.add('dark');
						document.documentElement.setAttribute('data-bs-theme', 'dark');
					}
					if (stored.getItem('selftest_language') === 'hindi') {
						document.documentElement.setAttribute('lang', 'hi');
					}
					if (stored.getItem('dataSaverMode') === 'true') {
						document.documentElement.classList.add('data-saver', 'reduce-motion');
					}
				} catch (error) {
					// localStorage unavailable (private mode etc.); defaults apply.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
