protocol_version: "1.0"
id: "CHG-0004"
title: "Visible statement numbers in rendered markdown lists"
status: "complete"
created_at: "2026-10-01T05:00:03Z"
request: "Statement-based questions show their statement numbers; test 1822 and every rendered markdown list keep visible list markers."
proposal:
  path: "proposal.md"
  revision: 1
  digest: "sha256:e7e9771de40ea189097466ffc8d64a3f9c6f0f41289ebd0af30ec32c94342c30"
scope:
  included:
    - "Rendered markdown ordered and unordered lists keep markers and indentation."
    - "E2E regression assertions for statement-question list markers."
  excluded:
    - "Question text, stored data, generation, and component-specific list styling."
  paths:
    - ".intent/**"
    - "src/**"
    - "tests/**"
preserved:
  - "Markdown text, sanitization, math/code/table handling, and non-list rendering stay unchanged."
  - "No data, API, telemetry, or locale changes."
test_changes:
