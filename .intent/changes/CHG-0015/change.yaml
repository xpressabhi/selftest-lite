protocol_version: "1.0"
id: "CHG-0015"
title: "Load the review when the device holds the cached paper but not the graded attempt"
status: "complete"
created_at: "2026-10-12T17:19:17Z"
request: "The results page still shows resultNotAvailable on production for a linked attempt on a device that has viewed the result before."
proposal:
  path: "proposal.md"
  revision: 1
  digest: "sha256:1d7029986d9f2b7c453c2e133803e231759150ff7b68964ef612f048dfc8bd0f"
scope:
  included:
    - "resolveTestRecord gains an opt-in fillAttempt mode: fetch when the graded attempt is not local, seed it, and merge attempt fields into the local paper."
    - "Results page passes fillAttempt: true."
    - "New regression spec in tests/e2e/cross-device-results.e2e.js."
  excluded:
    - "Behavior changes on /test and /print."
    - "Server, response cache, attribution or rendering changes."
  paths:
    - ".intent/changes/CHG-0015/**"
    - "src/lib/client/storage.js"
    - "src/routes/results/+page.svelte"
    - "tests/e2e/cross-device-results.e2e.js"
preserved:
  - "Same-device flow returns early with no network call."
  - "Fetch failure or missing records fall back to the local record."
  - "Synthetic-history specs keep working through the 404 fallback."
  - "No pre-existing test is modified, deleted or skipped."
test_changes:
  - path: "tests/e2e/cross-device-results.e2e.js"
    kind: "modified"
    reason: "Adds the regression spec for a device holding the paper without the graded attempt."
decisions:
  - "Only the results page opts into the fetch; /test and /print keep the local-first early return."
  - "Local content wins when both exist; only fields the local record lacks are filled."
  - "The fetch is best-effort: any failure keeps today's behavior."
review_required: false
